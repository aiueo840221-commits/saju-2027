<script>
(function(){
"use strict";
var __p = "";
window.__sajuPart = function(s){ __p += s; };
window.__sajuBoot = function(){
  var bin = atob(__p);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var ds = new DecompressionStream("gzip");
  var reader = new Blob([bytes]).stream().pipeThrough(ds).getReader();
  var dec = new TextDecoder();
  var out = "";
  function pump(){
    return reader.read().then(function(r){
      if (r.done) return out;
      out += dec.decode(r.value, {stream:true});
      return pump();
    });
  }
  pump().then(function(txt){
    var d = JSON.parse(txt);
    var st = document.createElement("style");
    st.textContent = d.css;
    document.head.appendChild(st);
    var frag = document.createElement("div");
    frag.innerHTML = d.body;
    while (frag.firstChild) document.body.appendChild(frag.firstChild);
    var sc = document.createElement("script");
    sc.textContent = d.js;
    document.body.appendChild(sc);
  }).catch(function(e){
    document.body.style.color = "#eceaf6";
    document.body.style.padding = "40px 20px";
    document.body.textContent = "화면을 불러오지 못했어요. 새로고침해 주세요.";
  });
};
})();
</script>
